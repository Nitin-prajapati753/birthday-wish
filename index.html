<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रोफेशनल मैजिकल विशिंग हब</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            --accent: #ff4757;
        }
        body { 
            background: var(--bg-grad); 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: white; 
            margin: 0; 
            overflow-x: hidden;
            min-height: 100vh;
        }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .box { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 35px 25px; border-radius: 20px; box-shadow: 0px 15px 45px rgba(0,0,0,0.6); width: 95%; max-width: 440px; z-index: 10; border: 1px solid rgba(255,255,255,0.25); box-sizing: border-box; display: none; transform: scale(0.95); transition: all 0.5s ease; }
        .box.active { display: block; transform: scale(1); animation: fadeInUp 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        h1 { font-size: 2.2rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); margin-bottom: 10px; color: #fff; }
        .big-emoji { font-size: 5rem; margin: 15px 0; animation: bounce 2s infinite; }
        .quote-box { font-size: 1.2rem; font-style: italic; background: rgba(0,0,0,0.3); padding: 18px; border-radius: 12px; margin: 20px 0; border-left: 6px solid var(--accent); text-align: left; line-height: 1.5; }
        .personal-msg { font-size: 1.1rem; color: #f1f2f6; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px dashed rgba(255,255,255,0.3); }
        input, select, textarea { padding: 12px 15px; width: 100%; border-radius: 25px; border: none; font-size: 1rem; margin-top: 12px; text-align: center; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); background: white; color: #333; box-sizing: border-box; }
        textarea { border-radius: 15px; resize: none; height: 80px; }
        .row { display: flex; gap: 10px; width: 100%; }
        .row select { width: 35%; }
        .row input { width: 65%; }
        button { padding: 14px 25px; background: linear-gradient(to right, #ff416c, #ff4b2b); color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 1.1rem; margin-top: 20px; font-weight: bold; width: 100%; box-shadow: 0 5px 20px rgba(255,65,108,0.4); transition: 0.3s; }
        button:active { transform: scale(0.98); }
        .share-btn { display: none; margin-top: 20px; padding: 15px; border-radius: 25px; color: white; font-weight: bold; font-size: 1.1rem; width: 100%; text-align: center; box-sizing: border-box; border: none; cursor: pointer; transition: 0.3s; background: linear-gradient(to right, #11998e, #38ef7d); box-shadow: 0 5px 20px rgba(56,239,125,0.4); }
        .nav-dots { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; }
        .dot.active { background: white; width: 20px; border-radius: 10px; }
        .balloon { position: absolute; width: 30px; height: 40px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; bottom: -50px; animation: floatUp 7s infinite linear; opacity: 0.6; z-index: 1; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <!-- फ़ॉर्म 1: मुख्य डैशबोर्ड -->
    <div class="box active" id="formPanel">
        <h1>✨ विशिंग हब मेकर</h1>
        <p style="color: #eee; font-size: 0.95rem;">प्रोफेशनल और जादुई बधाई संदेश तैयार करें</p>
        
        <select id="occSelect" onchange="updateOccThemes()">
            <option value="bday">🎂 जन्मदिन (Birthday)</option>
            <option value="anniv">💍 शादी की सालगिरह (Anniversary)</option>
            <option value="diwali">🪔 दीपावली (Diwali)</option>
            <option value="eid">🌙 ईद मुबारक (Eid)</option>
            <option value="holi">🎨 होली (Holi)</option>
            <option value="rakhi">🎀 रक्षाबंधन (Rakshabandhan)</option>
        </select>

        <input type="text" id="senderInput" placeholder="अपना (भेजने वाले का) नाम लिखें...">
        
        <div class="row">
            <select id="prefixSelect">
                <option value="Dear">Dear</option>
                <option value="Mr.">Mr.</option>
                <option value="Mrs.">Mrs.</option>
                <option value="Miss">Miss</option>
                <option value="Bro">Bro</option>
            </select>
            <input type="text" id="receiverInput" placeholder="पाने वाले का नाम...">
        </div>

        <textarea id="msgInput" placeholder="अपनी तरफ से कोई पर्सनल मैसेज या दुआ लिखें (वैकल्पिक)..."></textarea>
        
        <button id="genBtn" onclick="generateLink()">👉 जादुई लिंक तैयार करें</button>
        <!-- नेटिव शेयर ट्रिगर करने वाला नया बटन -->
        <button id="whatsappBtn" class="share-btn" onclick="nativeShareHub()">WhatsApp पर शेयर करें 📲</button>
    </div>

    <!-- देखने वाले की स्क्रीन 1: सीक्रेट क्लिक-टू-रिवील -->
    <div class="box" id="revealPanel">
        <h1 id="revealHeader">आपके लिए एक संदेश है!</h1>
        <div class="big-emoji">🎁</div>
        <p style="font-size: 1.2rem;" id="revealSub">किसी खास ने आपके लिए एक गुप्त सरप्राइज भेजा है.</p>
        <button onclick="goToPage(2)" style="background: linear-gradient(to right, #ff416c, #ff4b2b);">🎁 सरप्राइज खोलने के लिए यहाँ क्लिक करें</button>
    </div>

    <!-- देखने वाले की स्क्रीन 2: उत्सव एनीमेशन (पेज 2) -->
    <div class="box" id="page2Panel">
        <h1 id="page2Title">बधाई हो!</h1>
        <div class="big-emoji" id="page2Emoji">🎉</div>
        <p style="font-size: 1.3rem; font-weight: bold;" id="page2Greeting">उत्सव का समय आ गया है!</p>
        <button onclick="goToPage(3)">आगे बढ़ें 👉</button>
        <div class="nav-dots"><div class="dot active"></div><div class="dot"></div></div>
    </div>

    <!-- देखने वाले की स्क्रीन 3: मुख्य शायरी और पर्सनल मैसेज (पेज 3) -->
    <div class="box" id="page3Panel">
        <h1 id="page3Title">विशेष शुभकामनाएं</h1>
        <div class="quote-box" id="quoteText">बधाई संदेश लोड हो रहा है...</div>
        <div class="personal-msg" id="personalText" style="display:none;"></div>
        <p style="font-size: 0.9rem; margin-top:25px; opacity: 0.7;" id="footerCredit">✨ नितिन विशिंग प्लेटफॉर्म द्वारा बनाया गया</p>
        <div class="nav-dots"><div class="dot"></div><div class="dot active"></div></div>
    </div>
</div>

<audio id="bdayMusic" loop>
    <source src="https://soundhelix.com" type="audio/mp3">
</audio>

<script>
    let finalShareText = "";
    let finalShareUrl = "";

    const occData = {
        bday: { title: "जन्मदिन मुबारक!", emoji: "🎂", quote: "🎁 तोहफा मैं तुझे आज मेरा दिल ही देता हूँ, इस खास दिन पर अपनी सारी दुआएं देता हूँ, उम्र तुझे लगे आसमान के सितारों जैसी, ज़िंदगी में तेरी सिर्फ खुशियां ही खुशियां देता हूँ! 🎈", grad: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)" },
        anniv: { title: "शादी की सालगिरह मुबारक!", emoji: "💍", quote: "💖 सात फेरों से बंधा यह प्यार का बंधन, जीवन भर यूं ही महकता रहे आपका चमन। आप दोनों की जोड़ी हमेशा सलामत रहे, यही है ईश्वर से हमारा सुमिरन! 🥂", grad: "linear-gradient(135deg, #fd746c 0%, #ff9068 100%)" },

        holi: { title: "हैप्पी होली!", emoji: "🎨", quote: "🌈 पिचकारी की धार, गुलाल की बौछार, अपनों का प्यार, यही है होली का त्यौहार। रंगों से भरी रहे आपकी दुनिया हमेशा! बुरा न मानो होली है! 🥳", grad: "linear-gradient(135deg, #ec008c 0%, #fc6767 100%)" },
        rakhi: { title: "रक्षाबंधन की बधाई!", emoji: "🎀", quote: "👧 रक्षाबंधन का त्योहार है, हर तरफ खुशियों की बौछार है, बंधा एक धागे में भाई-बहन का प्यार है! हैप्पी रक्षाबंधन! ❤️", grad: "linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%)" }
    };

    function updateOccThemes() {
        const occ = document.getElementById('occSelect').value;
        document.body.style.background = occData[occ].grad;
    }

    function createBalloons() {
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6b81', '#ffffff'];
        for (let i = 0; i < 15; i++) {
            let b = document.createElement('div');
            b.className = 'balloon';
            b.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            b.style.left = Math.random() * 95 + 'vw';
            b.style.animationDelay = Math.random() * 4 + 's';
            b.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(b);
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const sName = urlParams.get('s');
    const rName = urlParams.get('r');
    const pfx = urlParams.get('p') || '';
    const occType = urlParams.get('o') || 'bday';
    const cMsg = urlParams.get('m');

    if (sName && rName) {
        document.getElementById('formPanel').classList.remove('active');
